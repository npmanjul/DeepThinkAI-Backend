name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            cd /root/DeepThinkAI/DeepThinkAI-Backend
            git pull origin main
            cd ..
            docker compose up -d --build deepthinkai-backend
